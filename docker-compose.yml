services:
  db:
    image: postgres:16-alpine
    container_name: exampilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: exampilot
      POSTGRES_PASSWORD: exampilot
      POSTGRES_DB: exampilot
    ports:
      - "5433:5432"
    volumes:
      - exampilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exampilot -d exampilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exampilot_pgdata:
