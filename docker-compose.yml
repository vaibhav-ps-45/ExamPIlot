services:
  db:
    image: postgres:16-alpine
    container_name: exampilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: exampilot
      POSTGRES_PASSWORD: exampilot
      POSTGRES_DB: exampilot
    ports:
      - "5433:5432"
    volumes:
      - exampilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exampilot -d exampilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://exampilot:exampilot@db:5432/exampilot?schema=public
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-access-token-key-do-not-use-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-compose-refresh-token-key-do-not-use-in-production}
    ports:
      - "${API_PORT:-4001}:4000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run prisma:deploy -w @exampilot/api && npm run start -w @exampilot/api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  exampilot_pgdata:
